name: Daily Football Prediction

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - date
          - manual
      value:
        description: 'Value for date or manual'
        required: false
        default: ''
      match_ids:
        description: 'Comma-separated match ids'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: football-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: football_predictor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inject token
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          if [ -z "$FOOTBALL_DATA_TOKEN" ]; then
            echo "::error::FOOTBALL_DATA_TOKEN secret not set"
            exit 1
          fi
          printf 'football_data_token: "%s"\n' "$FOOTBALL_DATA_TOKEN" > config.local.yaml

      - name: Run prediction
        env:
          TZ: 'Asia/Shanghai'
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          VALUE="${{ github.event.inputs.value }}"
          IDS="${{ github.event.inputs.match_ids }}"

          case "$MODE" in
            auto)
              python main.py
              ;;
            date)
              python main.py --date "$VALUE"
              ;;
            manual)
              python main.py --manual "$VALUE" --match-ids "$IDS"
              ;;
          esac

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-${{ github.run_number }}
          path: |
            football_predictor/output/*.md
            football_predictor/output/*.json
            football_predictor/output/*.csv
          retention-days: 30
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          echo "## Prediction Results" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          ls -lh output/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "no output" >> $GITHUB_STEP_SUMMARY