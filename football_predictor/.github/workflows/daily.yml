name: Daily Football Prediction

on:
  schedule:
    # 北京时间 11:00 = UTC 03:00
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - date
          - manual
      value:
        description: '参数（date 用 YYYY-MM-DD；manual 用赛程文本，支持 \n 字面量）'
        required: false
        default: ''
      match_ids:
        description: '逗号分隔的 match_id（可选）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: football-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject token via config.local.yaml
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          if [ -z "$FOOTBALL_DATA_TOKEN" ]; then
            echo "::error::FOOTBALL_DATA_TOKEN secret 未配置"
            exit 1
          fi
          cat > config.local.yaml <<EOF
          football_data_token: "${FOOTBALL_DATA_TOKEN}"
          EOF
          echo "config.local.yaml 已生成"

      - name: Run prediction
        env:
          TZ: 'Asia/Shanghai'
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          VALUE="${{ github.event.inputs.value }}"
          IDS="${{ github.event.inputs.match_ids }}"

          case "$MODE" in
            auto)
              python main.py
              ;;
            date)
              python main.py --date "$VALUE"
              ;;
            manual)
              python main.py --manual "$VALUE" --match-ids "$IDS"
              ;;
          esac

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-${{ github.run_number }}
          path: |
            output/*.md
            output/*.json
            output/*.csv
          retention-days: 30
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 预测运行结果"
            echo ""
            echo "- 时间：$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
            echo "- 模式：${{ github.event.inputs.mode || 'auto' }}"
            echo "- 状态：${{ job.status }}"
            echo ""
            echo "### 输出文件"
            echo '```'
            ls -lh output/ 2>/dev/null || echo "无输出"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
