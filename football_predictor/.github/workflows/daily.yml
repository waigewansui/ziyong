name: Daily Football Prediction

on:
  schedule:
    # 每天 11:00 北京时间（赛程发布后）
    - cron: '0 3 * * *'
    # 每天 21:00 北京时间（赛前 3 小时快照）
    - cron: '0 13 * * *'
    # 每天 23:00 北京时间（赛前 1 小时快照）
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: football_predictor

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Inject secrets
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: |
          {
            [ -n "$FOOTBALL_DATA_TOKEN" ] && echo "football_data_token: \"$FOOTBALL_DATA_TOKEN\""
            [ -n "$OWM_API_KEY" ] && echo "owm_api_key: \"$OWM_API_KEY\""
          } > config.local.yaml
      - name: Run prediction
        env:
          TZ: 'Asia/Shanghai'
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: python main.py --min-confidence 0.40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prediction-${{ github.run_number }}
          path: |
            football_predictor/output/*.md
            football_predictor/output/*.json
          retention-days: 30
      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "${{ secrets.DINGTALK_WEBHOOK }}" ]; then
            curl -X POST "${{ secrets.DINGTALK_WEBHOOK }}" \
              -H 'Content-Type: application/json' \
              -d '{"msgtype":"text","text":{"content":"❌ 每日预测失败 run #${{ github.run_number }}"}}'
          fi
