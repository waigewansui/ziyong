name: Daily Football Prediction

on:
  schedule:
    - cron: '0 3 * * *'   # 北京时间 11:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: football_predictor

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Inject token
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          if [ -n "$FOOTBALL_DATA_TOKEN" ]; then
            printf 'football_data_token: "%s"\n' "$FOOTBALL_DATA_TOKEN" > config.local.yaml
          fi
      - name: Run prediction
        env:
          TZ: 'Asia/Shanghai'
        run: python main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prediction-${{ github.run_number }}
          path: |
            football_predictor/output/*.md
            football_predictor/output/*.json
          retention-days: 30
